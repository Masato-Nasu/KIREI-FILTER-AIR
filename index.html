<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f4eee6" />
  <meta name="description" content="キレイに魅せるKIREI FILTER AIR。写真の光・色・質感を自然に整えます。" />
  <title>KIREI FILTER AIR</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./assets/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./assets/icon-192.png" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="app-shell">
    <main>
      <section class="hero" id="startPanel">
        <div class="hero-inner">
          <p class="hero-kicker">キレイに魅せる</p>
          <h1>KIREI FILTER AIR</h1>
          <p class="lead">写真の光・色・質感を自然に整えます。</p>
        </div>

        <div class="actions stack hero-actions">
          <label class="primary-btn file-btn">
            写真を選ぶ
            <input id="fileInput" type="file" accept="image/*" hidden />
          </label>
          <label class="secondary-btn file-btn">
            カメラで撮る
            <input id="cameraInput" type="file" accept="image/*" capture="user" hidden />
          </label>
        </div>
      </section>

      <section class="editor hidden" id="editorPanel" aria-label="写真編集">
        <div class="image-card">
          <div class="compare-stage" id="compareStage" style="--split: 50%">
            <img id="beforeImg" class="compare-img before" alt="補正前の写真" />
            <img id="afterImg" class="compare-img after" alt="補正後の写真" />
            <div class="split-line" aria-hidden="true"></div>
            <span class="label before-label">Before</span>
            <span class="label after-label">After</span>
          </div>
        </div>

        <div class="compare-control">
          <input id="compareSlider" type="range" min="0" max="100" value="50" aria-label="Before After 比較" />
        </div>

        <div class="mode-row" role="group" aria-label="補正モード">
          <button class="mode-btn active" type="button" data-mode="natural">Natural</button>
          <button class="mode-btn" type="button" data-mode="soft">Soft Light</button>
          <button class="mode-btn" type="button" data-mode="clear">Clear</button>
        </div>

        <div class="control-card">
          <div class="control-head">
            <span>やさしさ</span>
            <output id="intensityOut">20</output>
          </div>
          <input id="intensitySlider" type="range" min="0" max="30" value="20" />

          <div class="control-head eye-head">
            <span>目元（自動）</span>
            <output id="eyeOut">4.0%</output>
          </div>
          <input id="eyeSlider" type="range" min="0" max="80" value="40" step="1" aria-label="目元の自動補正" />

          <p id="modeDescription" class="mode-description">同じ写真のまま、光・色・質感を自然に整えます。</p>
        </div>

        <div class="actions grid-actions">
          <button id="saveBtn" class="primary-btn" type="button">保存</button>
          <label class="secondary-btn file-btn">
            別の写真
            <input id="replaceInput" type="file" accept="image/*" hidden />
          </label>
        </div>
      </section>
    </main>

    <p id="status" class="status" role="status" aria-live="polite">準備できました。</p>
  </div>

  <script src="./app.js" defer></script>
</body>
</html>
